<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harcama Takipçisi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Bütçe Takip</h2>

      <div class="balance-box">
        <h4>Güncel Bakiye</h4>
        <h1 id="balance">0.00 TL</h1>
      </div>

      <div class="inc-exp-container">
        <div>
          <h4>Gelir</h4>
          <p id="money-plus" class="money plus">+0.00 TL</p>
        </div>
        <div>
          <h4>Gider</h4>
          <p id="money-minus" class="money minus">-0.00 TL</p>
        </div>
      </div>

      <h3>Geçmiş İşlemler</h3>
      <ul id="list" class="list">
        <!-- JS ile dinamik olarak buraya eklenecek -->
      </ul>

      <h3>Yeni İşlem Ekle</h3>
      <form id="form">
        <div class="form-control">
          <label for="text">İşlem Adı</label>
          <input
            type="text"
            id="text"
            placeholder="Örn: Maaş, Market, Fatura..."
            required
          />
        </div>
        <div class="form-control">
          <label for="amount"
            >Miktar <br />
            (Gider için başına eksi '-' koyun. Örn: -500)</label
          >
          <input
            type="number"
            id="amount"
            placeholder="Miktar girin..."
            required
          />
        </div>
        <button class="btn">İşlemi Ekle</button>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
